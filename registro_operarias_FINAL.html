<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Registro de Confección</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c6af7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Confeccion">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: #2e2e3e;
    --accent: #7c6af7;
    --accent2: #f76a8a;
    --green: #4ade80;
    --yellow: #fbbf24;
    --text: #f0f0f5;
    --muted: #8888aa;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 20px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-icon {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .header-title { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
  .header-sub { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 1px; }

  /* Clock */
  .clock-bar {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .clock {
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 2px;
  }
  .date-label {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  /* Main */
  .main { padding: 20px 16px 40px; max-width: 480px; margin: 0 auto; }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* Select / Input */
  select, input[type="text"] {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 16px;
    padding: 14px 16px;
    outline: none;
    appearance: none;
    transition: border-color 0.2s;
  }
  select:focus, input[type="text"]:focus {
    border-color: var(--accent);
  }
  input[type="text"]::placeholder { color: var(--muted); }
  input[type="text"] { text-transform: uppercase; letter-spacing: 1px; }

  .select-wrap { position: relative; }
  .select-wrap::after {
    content: '▾';
    position: absolute;
    right: 16px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  /* Status badge */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    font-family: 'DM Mono', monospace;
  }
  .status-idle   { background: rgba(136,136,170,0.15); color: var(--muted); }
  .status-active { background: rgba(74,222,128,0.15);  color: var(--green); }
  .status-done   { background: rgba(251,191,36,0.15);  color: var(--yellow); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .dot.pulse { animation: pulse 1.2s infinite; }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.7); }
  }

  /* Buttons */
  .btn {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    font-family: 'Sora', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; pointer-events: none; }

  .btn-start {
    background: linear-gradient(135deg, var(--accent), #5b52e0);
    color: #fff;
    box-shadow: 0 4px 24px rgba(124,106,247,0.35);
    margin-bottom: 12px;
  }
  .btn-finish {
    background: linear-gradient(135deg, var(--accent2), #e0527a);
    color: #fff;
    box-shadow: 0 4px 24px rgba(247,106,138,0.35);
    margin-bottom: 12px;
  }
  .btn-send {
    background: linear-gradient(135deg, var(--green), #22c55e);
    color: #0f0f13;
    box-shadow: 0 4px 24px rgba(74,222,128,0.3);
  }
  .btn-cancel {
    background: var(--surface2);
    color: var(--muted);
    border: 1.5px solid var(--border);
    margin-top: 8px;
  }

  /* Time display */
  .time-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .time-box {
    flex: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .time-box.filled { border-color: var(--accent); }
  .time-box-label { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
  .time-box-value { font-family: 'DM Mono', monospace; font-size: 18px; color: var(--text); }
  .time-box-value.empty { color: var(--border); }

  /* Log */
  .log-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .log-count {
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .log-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }
  .log-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .log-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .log-info { flex: 1; min-width: 0; }
  .log-codigo { font-weight: 700; font-size: 14px; }
  .log-meta { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 2px; }
  .log-time { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--accent); text-align: right; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 20px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    z-index: 999;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error   { border-color: var(--accent2); color: var(--accent2); }
  .toast.info    { border-color: var(--accent); color: var(--accent); }

  /* Config panel */
  .config-panel {
    background: var(--surface2);
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .config-panel input {
    margin-top: 8px;
    font-size: 13px;
    padding: 10px 14px;
  }
  .config-label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
  .config-hint { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

  .divider { height: 1px; background: var(--border); margin: 16px 0; }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">✂️</div>
  <div>
    <div class="header-title">Registro de Confección</div>
    <div class="header-sub" id="headerSub">Cargando...</div>
  </div>
</div>

<div class="clock-bar">
  <div class="clock" id="clock">--:--:--</div>
  <div class="date-label" id="dateLabel">--</div>
</div>

<div class="main">

  <!-- Config panel oculto -->

  <!-- Formulario -->
  <div class="card">
    <div class="card-title">Identificación</div>

    <div class="select-wrap" style="margin-bottom:12px;">
      <select id="operaria">
        <option value="">— Seleccioná tu nombre —</option>
        <option>Monge</option>
        <option>Valverde</option>
        <option>Vargas</option>
        <option>Zuñiga</option>
        <!-- Agregá más operarias aquí -->
      </select>
    </div>

    <div style="position:relative;margin-bottom:12px;"><span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-family:DM Mono,monospace;font-size:16px;color:var(--muted);pointer-events:none;">COD</span><input type="text" id="codigo" placeholder="000" maxlength="3" style="background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-family:DM Mono,monospace;font-size:16px;padding:14px 16px 14px 56px;outline:none;width:100%;box-sizing:border-box;letter-spacing:3px;" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>
    <input type="number" id="cantidad" placeholder="Cantidad de vestidos" min="1" max="999" style="background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-family:Sora,sans-serif;font-size:16px;padding:14px 16px;outline:none;width:100%;box-sizing:border-box;margin-bottom:12px;">
    <textarea id="notas" placeholder="Notas u observaciones (opcional)" maxlength="200" rows="2" style="background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-family:Sora,sans-serif;font-size:14px;padding:12px 16px;outline:none;width:100%;box-sizing:border-box;resize:none;"></textarea>
  </div>

  <!-- Estado y botones -->
  <div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
      <div class="card-title" style="margin-bottom:0;">Estado</div>
      <div class="status-badge status-idle" id="statusBadge">
        <div class="dot"></div>
        <span id="statusText">En espera</span>
      </div>
    </div>

    <div class="time-row">
      <div class="time-box" id="boxInicio">
        <div class="time-box-label">Inicio</div>
        <div class="time-box-value empty" id="valInicio">--:--</div>
      </div>
      <div class="time-box" id="boxFin">
        <div class="time-box-label">Fin</div>
        <div class="time-box-value empty" id="valFin">--:--</div>
      </div>
    </div>

    <button class="btn btn-start" id="btnStart" onclick="marcarInicio()">
      ▶ Iniciar confección
    </button>
    <button class="btn btn-finish" id="btnFinish" onclick="marcarFin()" disabled>
      ⏹ Finalizar confección
    </button>
    <button class="btn btn-send" id="btnSend" onclick="enviarRegistro()" disabled>
      ✓ Guardar en planilla
    </button>
    <button class="btn btn-cancel" id="btnCancel" onclick="cancelar()" style="display:none;">
      ✕ Cancelar
    </button>
  </div>

  <div class="divider"></div>

  <!-- Historial local -->
  <div class="log-title">
    <span>Registros de hoy</span>
    <span class="log-count" id="logCount">0</span>
  </div>
  <div id="logList">
    <div class="log-empty">Sin registros aún</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── Estado ────────────────────────────────────────────────────────────
let horaInicio = null;
let horaFin    = null;
let registros  = JSON.parse(localStorage.getItem('registros_hoy') || '[]');
let SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzw8Zq4FfDdpivZRQwGT6Q8YvMRcSk7kFaT1AYdEYUqvf_yq6QZxBnK2dR36frmym0Q/exec";

// ── Config ────────────────────────────────────────────────────────────
function saveConfig() {
  const url = document.getElementById('scriptUrl').value.trim();
  if (!url.startsWith('https://')) return showToast('URL inválida', 'error');
  SCRIPT_URL = url;
  localStorage.setItem('script_url', url);
  const cp = document.getElementById('configPanel'); if(cp) cp.style.display = 'none';
  showToast('URL guardada ✓', 'success');
}

function initConfig() {
  if (SCRIPT_URL) {
    const cp = document.getElementById('configPanel'); if(cp) cp.style.display = 'none';
  } else {
    document.getElementById('scriptUrl').value = SCRIPT_URL;
  }
}

// ── Reloj ─────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('es-CR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  document.getElementById('dateLabel').textContent =
    now.toLocaleDateString('es-CR', {weekday:'long', day:'numeric', month:'long'});
  document.getElementById('headerSub').textContent =
    now.toLocaleDateString('es-CR', {day:'numeric', month:'short', year:'numeric'});
}
setInterval(updateClock, 1000);
updateClock();

// ── Acciones ──────────────────────────────────────────────────────────
function validar() {
  const op  = document.getElementById('operaria').value;
  const cod = document.getElementById('codigo').value.trim();
  const cant = document.getElementById('cantidad').value.trim();
  if (!op)  { showToast('Seleccioná tu nombre', 'error'); return false; }
  if (!cod) { showToast('Ingresá el código del vestido', 'error'); return false; }
  if (!cant) { showToast('Ingresá la cantidad de vestidos', 'error'); return false; }
  return true;
}

function marcarInicio() {
  if (!validar()) return;
  horaInicio = new Date();
  horaFin    = null;
  localStorage.setItem('estado_inicio', horaInicio.toISOString());
  localStorage.setItem('estado_operaria', document.getElementById('operaria').value);
  localStorage.setItem('estado_codigo', document.getElementById('codigo').value.trim());
  localStorage.setItem('estado_cantidad', document.getElementById('cantidad').value.trim());

  document.getElementById('valInicio').textContent =
    horaInicio.toLocaleTimeString('es-CR', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('valInicio').classList.remove('empty');
  document.getElementById('boxInicio').classList.add('filled');
  document.getElementById('valFin').textContent = '--:--';
  document.getElementById('valFin').classList.add('empty');
  document.getElementById('boxFin').classList.remove('filled');

  setStatus('active', 'Trabajando');
  document.getElementById('btnStart').disabled  = true;
  document.getElementById('btnFinish').disabled = false;
  document.getElementById('btnSend').disabled   = true;
  document.getElementById('btnCancel').style.display = 'block';

  // Bloquear campos mientras trabaja
  document.getElementById('operaria').disabled = true;
  document.getElementById('codigo').disabled   = true;
  document.getElementById('cantidad').disabled = true;
  // notas se mantiene editable durante la confeccion

  showToast('Inicio marcado ✓', 'info');
}

function marcarFin() {
  horaFin = new Date();
  document.getElementById('valFin').textContent =
    horaFin.toLocaleTimeString('es-CR', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('valFin').classList.remove('empty');
  document.getElementById('boxFin').classList.add('filled');

  setStatus('done', 'Listo para guardar');
  document.getElementById('btnFinish').disabled = true;
  document.getElementById('btnSend').disabled   = false;
  showToast('Fin marcado ✓', 'info');
}

function cancelar() {
  horaInicio = null; horaFin = null;
  localStorage.removeItem('estado_inicio');
  localStorage.removeItem('estado_operaria');
  localStorage.removeItem('estado_codigo');
  localStorage.removeItem('estado_cantidad');
  document.getElementById('valInicio').textContent = '--:--';
  document.getElementById('valFin').textContent    = '--:--';
  document.getElementById('valInicio').classList.add('empty');
  document.getElementById('valFin').classList.add('empty');
  document.getElementById('boxInicio').classList.remove('filled');
  document.getElementById('boxFin').classList.remove('filled');
  setStatus('idle', 'En espera');
  document.getElementById('btnStart').disabled  = false;
  document.getElementById('btnFinish').disabled = true;
  document.getElementById('btnSend').disabled   = true;
  document.getElementById('btnCancel').style.display = 'none';
  document.getElementById('operaria').disabled = false;
  document.getElementById('codigo').disabled   = false;
  document.getElementById('cantidad').disabled = false;
  // notas siempre editable
}

async function enviarRegistro() {
  if (!SCRIPT_URL) {
    showToast('Configurá la URL primero', 'error');
    const cp2 = document.getElementById('configPanel'); if(cp2) cp2.style.display = 'block';
    return;
  }

  const operaria = document.getElementById('operaria').value;
  const codigoRaw = document.getElementById('codigo').value.trim();
  const codigo = codigoRaw.padStart(3, '0');
  const cantidad = document.getElementById('cantidad').value.trim();
  const notas    = document.getElementById('notas').value.trim();
  const fecha    = horaInicio.toLocaleDateString('es-CR', {weekday:'long', day:'numeric', month:'numeric'});
  const ini      = horaInicio.toLocaleTimeString('es-CR', {hour:'2-digit', minute:'2-digit'});
  const fin      = horaFin.toLocaleTimeString('es-CR', {hour:'2-digit', minute:'2-digit'});

  document.getElementById('btnSend').disabled = true;
  document.getElementById('btnSend').textContent = '⏳ Guardando...';

  try {
    const params = new URLSearchParams({ fecha, operaria, codigo, cantidad, inicio: ini, fin, notas });
    await new Promise((resolve) => {
      const img = new Image();
      img.onload = img.onerror = resolve;
      img.src = SCRIPT_URL + '?' + params.toString();
    });

    // Guardar en historial local
    const reg = { fecha, operaria, codigo, cantidad, inicio: ini, fin, notas, ts: Date.now() };
    registros.unshift(reg);
    localStorage.setItem('registros_hoy', JSON.stringify(registros.slice(0, 50)));
    renderLog();

    showToast('¡Guardado en planilla! ✓', 'success');
    setTimeout(() => {
      cancelar();
      document.getElementById('codigo').value = '';
      document.getElementById('cantidad').value = '';
      document.getElementById('notas').value = '';
      document.getElementById('btnSend').textContent = '✓ Guardar en planilla';
    }, 1000);

  } catch(e) {
    document.getElementById('btnSend').disabled = false;
    document.getElementById('btnSend').textContent = '✓ Guardar en planilla';
    showToast('Error al guardar. Revisá la URL.', 'error');
  }
}

// ── UI helpers ────────────────────────────────────────────────────────
function setStatus(type, text) {
  const badge = document.getElementById('statusBadge');
  const dot   = badge.querySelector('.dot');
  badge.className = `status-badge status-${type}`;
  dot.className   = `dot${type === 'active' ? ' pulse' : ''}`;
  document.getElementById('statusText').textContent = text;
}

function renderLog() {
  const list = document.getElementById('logList');
  document.getElementById('logCount').textContent = registros.length;
  if (!registros.length) {
    list.innerHTML = '<div class="log-empty">Sin registros aún</div>';
    return;
  }
  list.innerHTML = registros.map(r => `
    <div class="log-item">
      <div class="log-dot"></div>
      <div class="log-info">
        <div class="log-codigo">COD ${r.codigo} (${r.cantidad}u) <span style="color:var(--muted);font-weight:400;font-size:12px;">— ${r.operaria}</span></div>
        <div class="log-meta">${r.fecha}${r.notas ? " · " + r.notas : ""}</div>
      </div>
      <div class="log-time">${r.inicio}<br><span style="color:var(--muted)">→</span> ${r.fin}</div>
    </div>
  `).join('');
}

function restaurarEstado() {
  const ini = localStorage.getItem('estado_inicio');
  if (!ini) return;
  horaInicio = new Date(ini);
  // Restaurar campos
  const op  = localStorage.getItem('estado_operaria');
  const cod = localStorage.getItem('estado_codigo');
  const cant = localStorage.getItem('estado_cantidad');
  if (op)   document.getElementById('operaria').value  = op;
  if (cod)  document.getElementById('codigo').value    = cod;
  if (cant) document.getElementById('cantidad').value  = cant;
  // Restaurar UI
  document.getElementById('valInicio').textContent =
    horaInicio.toLocaleTimeString('es-CR', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('valInicio').classList.remove('empty');
  document.getElementById('boxInicio').classList.add('filled');
  setStatus('active', 'Trabajando');
  document.getElementById('btnStart').disabled  = true;
  document.getElementById('btnFinish').disabled = false;
  document.getElementById('btnSend').disabled   = true;
  document.getElementById('btnCancel').style.display = 'block';
  document.getElementById('operaria').disabled = true;
  document.getElementById('codigo').disabled   = true;
  document.getElementById('cantidad').disabled = true;
  showToast('Sesión restaurada ✓', 'info');
}

function showToast(msg, type='info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.className = `toast ${type}`, 2500);
}

// ── Service Worker ───────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ── Init ──────────────────────────────────────────────────────────────
initConfig();
renderLog();
restaurarEstado();
</script>
</body>
</html>
